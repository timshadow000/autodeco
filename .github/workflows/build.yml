name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Указываем репозиторий и ветку биндингов (если требуется)
          bindings: geode-sdk/bindings
          bindings-ref: main
          # Включаем режим объединения для последующей сборки в один файл
          combine: true
          # Указываем target для текущей платформы из матрицы
          target: ${{ matrix.config.target }}
          # Используем nightly SDK (если нужен latest, замените на 'latest' или удалите строку)
          sdk: nightly

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
